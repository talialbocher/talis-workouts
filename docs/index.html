<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tali's Workouts</title>

<!-- iPhone home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#1e40af">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="app.webmanifest">

<style>
  :root {
    /* The week components read this for SVG figure fills. They are hardcoded
       light (#fff cards, #f9f9f7 panels), so the page commits to a light scheme. */
    --color-background-secondary: #fff;
    color-scheme: light;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #fafaf9;
    color: #111;
    font-family: system-ui, -apple-system, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #bar { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 0.5rem; }
  #brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  #brand b {
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: #1a1a1a;
  }
  #count { font-size: 12px; color: #9a9a9a; font-weight: 500; }
  /* Manifest titles run long, so cap the line at two rows — the header stays a
     fixed height as weeks are switched. The full text lives on each button's
     aria-label, and the week's own opening note explains the change in full. */
  #subtitle {
    font-size: 12px; color: #9a9a9a; margin: 0 0 10px; line-height: 1.45;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }

  /* Horizontal week strip — newest is the rightmost button. */
  #strip {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  #strip button {
    flex: 0 0 auto; min-width: 40px; width: 40px; padding: 7px 0;
    border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; border: 1px solid #e2e2e2; background: #fff; color: #666;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  #strip button[aria-current="true"] {
    font-weight: 600; border-color: #93c5fd; background: #dbeafe; color: #1e40af;
  }
  #strip button:focus-visible { outline: 2px solid #1e40af; outline-offset: 2px; }

  #msg {
    max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem;
    color: #666; font-size: 14px; line-height: 1.6;
  }
  #msg code {
    display: block; margin-top: 10px; padding: 8px 10px; background: #f4f4f5;
    border-radius: 6px; font-size: 12px; color: #444; white-space: pre-wrap;
    word-break: break-word;
  }
  .hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #strip button { transition: none; }
  }
</style>
</head>
<body>

<div id="bar" class="hidden">
  <div id="brand"><b>Talis</b><span id="count"></span></div>
  <p id="subtitle"></p>
  <div id="strip"></div>
</div>
<div id="msg">Loading this week's workout…</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>

<script>
(function () {
  var msg = document.getElementById('msg');
  var bar = document.getElementById('bar');
  var count = document.getElementById('count');
  var subtitle = document.getElementById('subtitle');
  var strip = document.getElementById('strip');
  var rootEl = document.getElementById('root');

  // One React root for the life of the page — switching weeks re-renders it
  // rather than reloading, so the strip stays put and scroll feels instant.
  var reactRoot = ReactDOM.createRoot(rootEl);
  var compiled = {};   // week number -> component, so revisits skip Babel
  var buttons = {};    // week number -> button element

  function fail(what, err) {
    reactRoot.render(null);
    msg.classList.remove('hidden');
    msg.innerHTML = "Couldn't load " + what + '.<code></code>';
    msg.querySelector('code').textContent = String(err && err.message || err);
  }

  // The week files are authored as ES modules for the artifact runtime. Strip the
  // module syntax so Babel's JSX transform output can run as a plain function body.
  function compile(src) {
    var body = src
      .replace(/^[ \t]*import[\s\S]*?from\s*["'][^"']+["'];?[ \t]*$/gm, '')
      .replace(/export\s+default\s+function\s+/, 'function ');
    var code = Babel.transform(body, { presets: ['react'] }).code;
    return new Function('React', 'useState', code + '\nreturn WorkoutSchedule;')(
      React, React.useState
    );
  }

  function select(entry) {
    Object.keys(buttons).forEach(function (n) {
      buttons[n].setAttribute('aria-current', String(+n === entry.week));
    });
    var active = buttons[entry.week];
    if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });

    subtitle.textContent = entry.title ? 'Pick a week · ' + entry.title : 'Pick a week';
    document.title = 'Week ' + entry.week + " · Tali's Workouts";

    // Keep the URL shareable/refreshable without adding history entries.
    try {
      history.replaceState(null, '', entry.week === newest ? './' : '?week=' + entry.week);
    } catch (e) { /* file:// and the like — not worth failing the render over */ }

    if (compiled[entry.week]) {
      msg.classList.add('hidden');
      reactRoot.render(React.createElement(compiled[entry.week]));
      return;
    }

    msg.classList.remove('hidden');
    msg.textContent = 'Loading week ' + entry.week + '…';
    reactRoot.render(null);

    fetch('weeks/' + entry.file, { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText + ' — weeks/' + entry.file);
        return r.text();
      })
      .then(function (src) {
        compiled[entry.week] = compile(src);
        msg.classList.add('hidden');
        reactRoot.render(React.createElement(compiled[entry.week]));
      })
      .catch(function (e) { fail('week ' + entry.week, e); });
  }

  var newest = null;

  fetch('weeks/manifest.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + r.statusText + ' — weeks/manifest.json');
      return r.json();
    })
    .then(function (weeks) {
      if (!Array.isArray(weeks) || !weeks.length) throw new Error('manifest.json is empty');
      weeks.sort(function (a, b) { return a.week - b.week; });  // oldest -> newest
      newest = weeks[weeks.length - 1].week;

      count.textContent = weeks.length + '-week program';

      weeks.forEach(function (w) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = w.week;
        b.setAttribute('aria-label', 'Week ' + w.week + (w.title ? ' — ' + w.title : ''));
        b.setAttribute('aria-current', 'false');
        b.addEventListener('click', function () { select(w); });
        strip.appendChild(b);
        buttons[w.week] = b;
      });

      var want = parseInt(new URLSearchParams(location.search).get('week'), 10);
      var entry = weeks.filter(function (w) { return w.week === want; })[0] ||
                  weeks[weeks.length - 1];

      bar.classList.remove('hidden');
      select(entry);
    })
    .catch(function (e) { fail('the workout list', e); });
})();
</script>
</body>
</html>
